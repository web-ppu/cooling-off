      <rect x="-0.7" y="-4" width="1.4" height="4" rx="0.7" transform="rotate(60)" />
    </g>
  </g>
  <g transform="rotate(120 12 12)">
    <polygon points="12,0.5 13.2,1.5 12,2.5 10.8,1.5" />
